<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>untuk snupi 💙🩷</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(
135deg,
#87ceeb 0%,
#a5d8ff 35%,
#f8b4d9 70%,
#ff9ed6 100%
);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.card{
width:90%;
max-width:750px;
padding:30px;
text-align:center;
background:rgba(255,255,255,.2);
backdrop-filter:blur(12px);
border-radius:25px;
color:white;
box-shadow:0 0 25px rgba(0,0,0,.15);
z-index:10;
}

h1{
margin-bottom:20px;
font-size:2.2rem;
}

button{
padding:15px 30px;
border:none;
border-radius:50px;
font-size:18px;
font-weight:bold;
cursor:pointer;
color:#ec4899;
background:white;
transition:.3s;
}

button:hover{
transform:scale(1.08);
}

#surat{
display:none;
margin-top:25px;
line-height:1.9;
font-size:1.1rem;
text-align:left;
white-space:pre-wrap;
}

.hati{
position:fixed;
top:-20px;
font-size:24px;
pointer-events:none;
animation:jatuh linear forwards;
}

@keyframes jatuh{
to{
transform:translateY(110vh);
opacity:0;
}
}

.cloud{
position:fixed;
pointer-events:none;
opacity:.8;
font-size:60px;
animation:awan linear infinite;
}

@keyframes awan{
from{
transform:translateX(-200px);
}
to{
transform:translateX(calc(100vw + 200px));
}
}
</style>
</head>

<body>

<audio id="musik" loop>
<source src="SnapTik.Net_7494726854880808223.mp3" type="audio/mpeg">
</audio>

<div class="card">

<h1>💙 untuk snupi 🩷</h1>

<button onclick="bukaSurat()">
buka surat 💌
</button>

<div id="surat"></div>

</div>

<script>

const isiSurat = `
halooo snupiii,

ga nyangka ya kita bisa kenal dan temenan sampai sejauh ini. awalnya mungkin cuma ngobrol biasa, bercanda random, atau saling kirim hal-hal ga jelas, tapi entah kenapa semuanya jadi seru kalau sama kamu.

makasih ya udah jadi temen yang selalu ada. makasih buat semua candaan receh, obrolan random, cerita-cerita ga penting yang malah jadi kenangan, dan semua momen yang bikin hari-hari jadi lebih rame.

jujur aja, ga semua orang bisa bikin nyaman. tapi kamu salah satu orang yang bikin ngobrol berjam-jam kerasa cepet banget.

akuu seneng banget bisa kenal sama kamu. semoga ke depannya kita tetap temenan, tetap bisa ketawa bareng, saling support kalau lagi ada masalah, dan ga jadi asing walaupun nanti sibuk masing-masing.

pokoknya makasih udah jadi snupi yang akuu kenal sekarang.

semoga semua hal baik datang ke hidup kamu, semua yang kamu pengenin bisa tercapai, dan semoga kamu selalu punya alasan buat senyum setiap hari.

seneng banget punya sahabat kayak kamu 💙🩷

best friend forever.
`;

function bukaSurat(){

document.getElementById("surat").style.display="block";

const musik=document.getElementById("musik");
musik.play().catch(()=>{});

const surat=document.getElementById("surat");

surat.innerHTML="";

let i=0;

function ketik(){

if(i<isiSurat.length){

surat.innerHTML+=isiSurat.charAt(i);

i++;

setTimeout(ketik,35);

}

}

ketik();

}

function buatHati(){

const hati=document.createElement("div");

hati.className="hati";

const emoji=["💙","🩷","🤍"];

hati.innerHTML=
emoji[Math.floor(Math.random()*emoji.length)];

hati.style.left=Math.random()*100+"vw";

hati.style.animationDuration=
(Math.random()*3+3)+"s";

document.body.appendChild(hati);

setTimeout(()=>{
hati.remove();
},6000);

}

setInterval(buatHati,300);

function buatAwan(){

const awan=document.createElement("div");

awan.className="cloud";

awan.innerHTML="☁️";

awan.style.top=Math.random()*60+"vh";

awan.style.fontSize=
(Math.random()*40+40)+"px";

awan.style.animationDuration=
(Math.random()*20+20)+"s";

document.body.appendChild(awan);

setTimeout(()=>{
awan.remove();
},45000);

}

setInterval(buatAwan,4000);

for(let i=0;i<5;i++){
setTimeout(buatAwan,i*1000);
}

</script>

</body>
</html>
